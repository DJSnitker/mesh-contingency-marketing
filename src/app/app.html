<header class="nav" [class.open]="menuOpen()">
  <div class="wrap nav-inner">
    <a class="brand" routerLink="/" (click)="menuOpen.set(false)">
      <img src="branding/mesh-contingency-mark.svg" alt="" width="34" height="37" />
      <span class="wordmark"><span class="w-mesh">Mesh</span><span class="w-cont">Contingency</span></span>
    </a>
    <button
      type="button"
      class="menu-btn"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-menu"
      (click)="menuOpen.set(!menuOpen())"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      <span class="sr-only">Menu</span>
    </button>
    <nav id="site-menu" aria-label="Main">
      @for (item of nav; track item.link) {
        <a [routerLink]="item.link" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen.set(false)">
          {{ item.label }}
        </a>
      }
      <a class="btn btn-sm" [href]="wiki" target="_blank" rel="noopener">Docs</a>
    </nav>
  </div>
</header>

<main id="top">
  <router-outlet />

  <section class="closing">
    <div class="wrap">
      <img src="branding/mesh-contingency-lockup.svg" alt="Mesh Contingency" width="560" height="199" />
      <p>A contingency link over MeshCore.</p>
      <div class="cta">
        <a class="btn" routerLink="/setup">Set up a node <app-icon name="arrow" /></a>
        <a class="btn btn-ghost" [href]="repo" target="_blank" rel="noopener"><app-icon name="github" /> GitHub</a>
      </div>
      <p class="contact">
        Want more information? Email
        <a [href]="'mailto:' + email">{{ email }}</a>
      </p>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap foot-inner">
    <span>© {{ year }} Doug Snitker</span>
    <nav aria-label="Footer">
      @for (item of nav; track item.link) {
        <a [routerLink]="item.link">{{ item.label }}</a>
      }
      <a [href]="wiki" target="_blank" rel="noopener">Wiki</a>
      <a [href]="repo" target="_blank" rel="noopener">GitHub</a>
      <a [href]="'mailto:' + email">Contact</a>
    </nav>
  </div>
</footer>
